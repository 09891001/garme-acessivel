<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garme Acessível | Jogo</title>

<link rel="stylesheet" href="css/estilo.css">

</head>

<body>

<header>

<h1>Garme Acessível</h1>

<div id="placar" aria-live="polite">
Placar carregando...
</div>

</header>

<div id="avisos" aria-live="assertive">
Aguardando jogadores...
</div>

<section id="menu-cego" aria-label="Menu do desenhista">

<h2>Escolher desenho</h2>

<p>Somente o desenhista pode usar estes botões.</p>

<div>

<button class="btn-desenho" onclick="desenharAutomatico('casa')">
Casa
</button>

<button class="btn-desenho" onclick="desenharAutomatico('bola')">
Bola
</button>

<button class="btn-desenho" onclick="desenharAutomatico('sol')">
Sol
</button>

</div>

<hr>

<input
type="text"
id="palavra-manual"
placeholder="Exemplo: gato"
style="width:100%;height:45px;font-size:18px;"

>

<button
onclick="definirPalavraManual()"
style="width:100%;height:50px;margin-top:10px;"

>

CONFIRMAR PALAVRA </button>

</section>

<section aria-label="Quadro de desenho">

<canvas
id="quadro"
width="400"
height="350"
aria-label="Área de desenho"

>

Aguardando início do jogo... </canvas>

</section>

<section aria-label="Mensagens do jogo">

<h2>Palpites</h2>

<div id="lista-mensagens" aria-live="polite">
</div>

</section>

<section id="controles-palpite">

<input
type="text"
id="palpite"
placeholder="Digite sua resposta..."
style="width:100%;height:50px;font-size:18px;"

>

<button
id="btn-enviar"
onclick="enviarPalpite()"
style="width:100%;height:50px;margin-top:10px;"

>

ENVIAR PALPITE </button>

</section>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="js/config.js"></script>

<script>

if(!firebase){

alert("Erro ao carregar Firebase")

}

const db = firebase.database()

const dbRef = db.ref("sala")

let meuNomeLogado = localStorage.getItem("nomeJogador")

if(!meuNomeLogado){

meuNomeLogado = prompt("Digite seu nome")

localStorage.setItem("nomeJogador",meuNomeLogado)

}



const mensagensRef = db.ref("mensagens")



function enviarPalpite(){

const input = document.getElementById("palpite")

const texto = input.value.trim()

if(texto==="") return



mensagensRef.push({

nome:meuNomeLogado,

mensagem:texto,

data:Date.now()

})



input.value=""

}



mensagensRef.on("child_added",(snap)=>{

const dados = snap.val()

const lista = document.getElementById("lista-mensagens")



const p = document.createElement("p")

p.textContent = dados.nome + ": " + dados.mensagem



lista.appendChild(p)

lista.scrollTop = lista.scrollHeight

})



function definirPalavraManual(){

const campo = document.getElementById("palavra-manual")

const palavra = campo.value.trim()



if(palavra==="") return



dbRef.update({

palavra:palavra,

status:"jogando"

})



campo.value=""

}



dbRef.on("value",(snap)=>{

const dados = snap.val()



if(!dados) return



const aviso = document.getElementById("avisos")



if(dados.status==="jogando"){

aviso.innerText = "Rodada em andamento"

}



if(dados.desenhista===meuNomeLogado){

aviso.innerText = "Você é o desenhista"

}



})



document.getElementById("palpite").addEventListener("keypress",function(e){

if(e.key==="Enter"){

enviarPalpite()

}

})

</script>

<script src="js/desenho.js"></script>

<script src="js/jogo.js"></script>

</body>

</html>
