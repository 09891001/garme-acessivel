<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garme Acessível</title>

<link rel="stylesheet" href="css/stylo.css">
<link rel="icon" href="data:,">

</head>

<body>

<!-- ACESSIBILIDADE GLOBAL -->
<div 
id="areaAcessivel"
class="sr-only"
aria-live="assertive"
role="alert">
Sistema carregado
</div>

<header id="cabecalhoPrincipal">

<h1 id="tituloPrincipal">
GARME ACESSÍVEL
</h1>

<div id="statusSistema" aria-live="polite">
Aguardando login...
</div>

<div id="displayUsuario" aria-live="polite">
Offline
</div>

</header>

<main id="conteudoPrincipal">

<!-- LOGIN -->
<section 
id="lobby"
role="region"
aria-label="Tela de login">

<h2 id="tituloLogin">
Entrar no Jogo
</h2>

<label for="nomeUsuario">
Como você quer ser chamado?
</label>

<input 
type="text"
id="nomeUsuario"
placeholder="Digite seu nome"
aria-label="Digite seu nome"
autocomplete="off"
/>

<button 
id="btnEntrarPartida"
aria-label="Entrar na partida">
Entrar na partida
</button>

</section>

<!-- JOGO -->
<section 
id="areaJogo"
style="display:none;"
aria-label="Área do jogo">

<!-- CONTROLE -->
<section 
id="controleJogo"
aria-label="Controle do jogo">

<div id="timerPartida" aria-live="polite">
Tempo: 120
</div>

<div id="palavraAtual" aria-live="polite">
Aguardando rodada
</div>

</section>

<!-- ESCOLHA DESENHO -->
<section 
id="areaEscolhaDesenho"
style="display:none;"
aria-label="Escolher tipo de desenho">

<button id="btnManual" aria-label="Selecionar desenho manual">
Selecionar desenho manual
</button>

<button id="btnAuto" aria-label="Selecionar desenho automático">
Selecionar desenho automático
</button>

</section>

<!-- LISTA (mantido para compatibilidade futura) -->
<section id="listaDesenhos" aria-label="Lista de desenhos"></section>

<!-- DESENHO -->
<section id="areaDesenho" aria-label="Área de desenho">

<h2>Área de desenho</h2>

<canvas 
id="quadroDesenho"
role="img"
aria-label="Quadro de desenho"
tabindex="0">
</canvas>

<button id="btnLimparQuadro" aria-label="Limpar quadro">
Limpar quadro
</button>

</section>

<!-- CHAT -->
<section id="areaChat" aria-label="Chat do jogo">

<h2>Chat</h2>

<div 
id="janelaChat"
role="log"
aria-live="polite"
aria-relevant="additions"
tabindex="0">
</div>

<input
type="text"
id="chutePalavra"
placeholder="Digite sua resposta"
aria-label="Digite sua resposta"
autocomplete="off"
/>

<button id="btnEnviarChute" aria-label="Enviar resposta">
Enviar
</button>

</section>

<!-- RANKING -->
<section id="areaRanking" aria-label="Ranking do jogo">

<h2>Ranking</h2>

<ul id="listaRanking" aria-live="polite"></ul>

</section>

<!-- CONTROLE PARTIDA -->
<section id="controlePartida" aria-label="Controle da partida">

<button id="btnEntrarRodada" aria-label="Iniciar rodada">
Entrar na rodada
</button>

<button id="btnSair" aria-label="Sair da partida">
Sair da partida
</button>

<button 
id="botaoResetAcessivel"
aria-label="Resetar jogo"
class="btnAcessivel">
Resetar jogo
</button>

</section>

</section>

</main>

<footer id="rodapePrincipal">

<div id="rodapeStatus" aria-live="polite">
Sistema carregado
</div>

</footer>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- SCRIPTS -->
<script src="js/config.js"></script>
<script src="js/desenho.js"></script>
<script src="js/jogo.js"></script>

<!-- EVENTOS CENTRALIZADOS -->
<script>

document.addEventListener("DOMContentLoaded", function(){

// LOGIN
const inputNome = document.getElementById("nomeUsuario");
if(inputNome){
inputNome.addEventListener("keypress", function(e){
if(e.key === "Enter" && window.realizarLogin){
window.realizarLogin();
}
});
}

const btnEntrar = document.getElementById("btnEntrarPartida");
if(btnEntrar){
btnEntrar.addEventListener("click", function(){
if(window.realizarLogin){
window.realizarLogin();
}
});
}

// CHAT
const inputChute = document.getElementById("chutePalavra");
if(inputChute){
inputChute.addEventListener("keypress", function(e){
if(e.key === "Enter" && window.enviarChute){
window.enviarChute();
}
});
}

const btnEnviar = document.getElementById("btnEnviarChute");
if(btnEnviar){
btnEnviar.addEventListener("click", function(){
if(window.enviarChute){
window.enviarChute();
}
});
}

// DESENHO
const btnManual = document.getElementById("btnManual");
if(btnManual){
btnManual.addEventListener("click", function(){
if(window.escolherDesenhoManual){
window.escolherDesenhoManual();
}
});
}

const btnAuto = document.getElementById("btnAuto");
if(btnAuto){
btnAuto.addEventListener("click", function(){
if(window.escolherDesenhoAutomatico){
window.escolherDesenhoAutomatico();
}
});
}

const btnLimpar = document.getElementById("btnLimparQuadro");
if(btnLimpar){
btnLimpar.addEventListener("click", function(){
if(window.limparQuadroSincronizado){
window.limparQuadroSincronizado();
}
});
}

// PARTIDA
const btnEntrarRodada = document.getElementById("btnEntrarRodada");
if(btnEntrarRodada){
btnEntrarRodada.addEventListener("click", function(){
if(window.entrarPartida){
window.entrarPartida();
}
});
}

const btnSair = document.getElementById("btnSair");
if(btnSair){
btnSair.addEventListener("click", function(){
if(window.sairPartida){
window.sairPartida();
}
});
}

const btnReset = document.getElementById("botaoResetAcessivel");
if(btnReset){
btnReset.addEventListener("click", function(){
if(window.resetarJogoCompleto){
window.resetarJogoCompleto();
}
});
}

});

// ACESSIBILIDADE TECLADO
function focarAreaChat(){
const chat = document.getElementById("janelaChat");
if(chat) chat.focus();
}

function focarCanvas(){
const canvas = document.getElementById("quadroDesenho");
if(canvas) canvas.focus();
}

document.addEventListener("keydown", function(e){

if(e.altKey && e.key === "1"){
focarAreaChat();
}

if(e.altKey && e.key === "2"){
focarCanvas();
}

});

// FEEDBACK INICIAL
window.addEventListener("load", function(){
const area = document.getElementById("areaAcessivel");
if(area){
area.textContent = "Sistema carregado";
}
});

</script>

</body>
</html>
