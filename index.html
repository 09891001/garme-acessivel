<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sala de Espera | Garme Acessível</title>

<link rel="stylesheet" href="css/estilo.css">

<style>

body{
background:#0b2e6b;
color:white;
font-family:Arial;
text-align:center;
}

.container{
max-width:600px;
margin:auto;
margin-top:60px;
background:white;
color:black;
padding:30px;
border-radius:10px;
}

h1{
color:#0b2e6b;
}

#lista-jogadores{
margin-top:20px;
border:1px solid #ddd;
padding:10px;
height:200px;
overflow:auto;
}

#btn-play{
margin-top:20px;
height:60px;
width:100%;
font-size:20px;
background:#28a745;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>Garme Acessível</h1>

<h2>Time ATS - TOTVS</h2>

<p>Seja bem vindo à sala do jogo.</p>

<p>Aguarde os outros jogadores entrarem.</p>

<div id="nome-jogador"></div>

<h3>Jogadores na sala</h3>

<div id="lista-jogadores"></div>

<button id="btn-play">
INICIAR JOGO
</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="js/config.js"></script>

<script>

const db = firebase.database()

const salaRef = db.ref("sala")

const jogadoresRef = db.ref("jogadores")

let nome = localStorage.getItem("nomeJogador")

if(!nome){

nome = prompt("Digite seu nome")

localStorage.setItem("nomeJogador",nome)

}

document.getElementById("nome-jogador").innerText =
"Você entrou como: "+nome



// registrar jogador

jogadoresRef.child(nome).set({
nome:nome
})


// atualizar lista jogadores

jogadoresRef.on("value",snap=>{

const dados = snap.val()

const lista = document.getElementById("lista-jogadores")

lista.innerHTML=""

for(let jogador in dados){

const div = document.createElement("div")

div.innerText = dados[jogador].nome

lista.appendChild(div)

}

})



// botão play

document.getElementById("btn-play").onclick=()=>{

salaRef.set({
status:"jogando"
})

}



// se jogo iniciar

salaRef.on("value",snap=>{

const dados = snap.val()

if(dados && dados.status==="jogando"){

window.location.href="jogo.html"

}

})

</script>

</body>

</html>
