<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garme Acessível</title>

<link rel="stylesheet" href="css/stylo.css">
<link rel="icon" href="data:,">

</head>

<body>

<!-- ACESSIBILIDADE -->
<div id="areaAcessivel" class="sr-only" aria-live="assertive" role="alert">
Sistema carregado
</div>

<header>

<h1 id="tituloPrincipal">GARME ACESSÍVEL</h1>

<div id="statusSistema" aria-live="polite">
Aguardando login...
</div>

<div id="displayUsuario" aria-live="polite">
Offline
</div>

</header>

<main>

<!-- LOGIN -->
<section id="lobby">

<h2>Entrar no Jogo</h2>

<label for="nomeUsuario">Como você quer ser chamado?</label>

<input type="text" id="nomeUsuario" placeholder="Digite seu nome" />

<button id="btnEntrarPartida">
Entrar na partida
</button>

</section>

<!-- JOGO -->
<section id="areaJogo" style="display:none;">

<!-- STATUS DA PARTIDA -->
<div id="statusPartida" aria-live="polite">
Aguardando jogadores...
</div>

<!-- TOPO -->
<section id="controleJogo">

<div id="timerPartida">Tempo: 120</div>
<div id="palavraAtual">Aguardando rodada</div>

</section>

<!-- ESCOLHA DO DESENHO -->
<section id="areaEscolhaDesenho" style="display:none;">

<h2>Você é o desenhista</h2>

<p>Escolha como deseja jogar:</p>

<button id="btnManual">
✏️ Desenho Manual
</button>

<button id="btnAuto">
🎲 Desenho Automático
</button>

</section>

<!-- ÁREA DE DESENHO -->
<section id="areaDesenho">

<h2>Área de desenho</h2>

<p id="descricaoDesenho">
Use mouse, toque ou teclado para desenhar
</p>

<canvas 
id="quadroDesenho"
tabindex="0"
aria-label="Quadro de desenho">
</canvas>

<button id="btnLimparQuadro">
🧹 Limpar quadro
</button>

</section>

<!-- CHAT -->
<section id="areaChat">

<h2>Chat</h2>

<div id="janelaChat" tabindex="0"></div>

<input type="text" id="chutePalavra" placeholder="Digite sua resposta" />

<button id="btnEnviarChute">
Enviar
</button>

</section>

<!-- RANKING -->
<section id="areaRanking">

<h2>Ranking</h2>

<ul id="listaRanking"></ul>

</section>

<!-- CONTROLE -->
<section id="controlePartida">

<button id="btnEntrarRodada">
▶️ Iniciar rodada
</button>

<button id="btnSair">
🚪 Sair
</button>

<button id="botaoResetAcessivel">
♻️ Resetar
</button>

</section>

</section>

</main>

<footer>
Sistema ativo
</footer>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="js/config.js"></script>
<script src="js/desenho.js"></script>
<script src="js/jogo.js"></script>

<!-- EVENTOS CENTRALIZADOS -->
<script>

document.addEventListener("DOMContentLoaded", function(){

// LOGIN
document.getElementById("btnEntrarPartida")?.addEventListener("click", () => {
window.realizarLogin && window.realizarLogin();
});

// ENTER LOGIN
document.getElementById("nomeUsuario")?.addEventListener("keypress", (e)=>{
if(e.key==="Enter"){
window.realizarLogin && window.realizarLogin();
}
});

// CHAT
document.getElementById("btnEnviarChute")?.addEventListener("click", ()=>{
window.enviarChute && window.enviarChute();
});

document.getElementById("chutePalavra")?.addEventListener("keypress",(e)=>{
if(e.key==="Enter"){
window.enviarChute && window.enviarChute();
}
});

// DESENHO
document.getElementById("btnManual")?.addEventListener("click", ()=>{
window.escolherDesenhoManual && window.escolherDesenhoManual();
});

document.getElementById("btnAuto")?.addEventListener("click", ()=>{
window.escolherDesenhoAutomatico && window.escolherDesenhoAutomatico();
});

document.getElementById("btnLimparQuadro")?.addEventListener("click", ()=>{
window.limparQuadroSincronizado && window.limparQuadroSincronizado();
});

// PARTIDA
document.getElementById("btnEntrarRodada")?.addEventListener("click", ()=>{
window.entrarPartida && window.entrarPartida();
});

document.getElementById("btnSair")?.addEventListener("click", ()=>{
window.sairPartida && window.sairPartida();
});

document.getElementById("botaoResetAcessivel")?.addEventListener("click", ()=>{
window.resetarJogoCompleto && window.resetarJogoCompleto();
});

});

</script>

</body>
</html>
