<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garme Acessível - Versão Final</title>
    <link rel="stylesheet" href="css/stylo.css">
</head>
<body>

    <div id="narrador" class="sr-only" aria-live="polite"></div>

    <div class="container">
        
        <header class="header">
            <div class="logo">GARME ACESSÍVEL</div>
            <div id="feedbackAcessivel">Aguardando login...</div>
            <div class="user-badge" id="displayUsuario">Offline</div>
        </header>

        <div id="lobby" class="overlay">
            <div class="modal">
                <h1>Entrar no Jogo</h1>
                <p>Como você quer ser chamado?</p>
                <input type="text" id="nomeUsuario" placeholder="Digite seu nome..." 
                       style="width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #ccc;">
                <button onclick="realizarLogin()" class="btn-primary">ENTRAR NA PARTIDA</button>
            </div>
        </div>

        <div id="galeriaDesenhos" class="overlay" style="display: none;">
            <div class="modal modal-grande">
                <h2>O que o robô deve desenhar?</h2>
                <p>Escolha um objeto da biblioteca para iniciar a narração automática:</p>
                
                <div id="listaDesenhos" class="grid-drawings"></div>
                
                <button onclick="document.getElementById('galeriaDesenhos').style.display='none'" class="btn-danger" style="margin-top: 20px;">
                    CANCELAR
                </button>
            </div>
        </div>

        <main class="game-area">
            
            <section class="canvas-section">
                <div class="controles-modo" style="position: absolute; top: 80px; z-index: 100; display: flex; gap: 10px; width: 100%; justify-content: center;">
                    <button onclick="modoManual()" class="btn-primary" style="background: #004b81;">DESENHO MANUAL</button>
                    <button onclick="alternarModoAutomatico()" class="btn-primary" style="background: #004b81;">DESENHO AUTOMÁTICO</button>
                    
                    <button id="btnConfirmarInicio" class="btn-success hidden" style="border: 3px solid white;">
                        OK - INICIAR RODADA (2 MIN)
                    </button>
                </div>

                <canvas id="quadro" width="800" height="500"></canvas>
            </section>

            <section class="chat-section">
                <div class="chat-window" id="janelaChat">
                    <p><strong>Sistema:</strong> Bem-vindo! Aguarde o mestre definir o desenho.</p>
                </div>
                
                <div class="chat-controls">
                    <input type="text" id="chutePalavra" placeholder="Qual é o desenho?">
                    <button onclick="enviarChute()" class="btn-success">CHUTAR</button>
                </div>
            </section>

        </main>
    </div>

    <script src="js/desenho.js"></script>
    <script type="module" src="js/jogo.js"></script>

</body>
</html>
