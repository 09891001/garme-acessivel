<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garme Acessível - Multiplayer</title>

    <link rel="stylesheet" href="css/stylo.css">
</head>
<body>

    <!-- Narrador acessível -->
    <div id="narrador" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <div class="container">
        
        <!-- HEADER -->
        <header class="header">
            <div class="logo">GARME ACESSÍVEL</div>
            <div id="feedbackAcessivel">Aguardando login...</div>
            <div class="user-badge" id="displayUsuario">Offline</div>
        </header>

        <!-- LOGIN (ID CORRETO PARA O JS) -->
        <div id="lobby" class="overlay">
            <div class="modal">
                <h1>Entrar no Jogo</h1>
                <p>Como você quer ser chamado?</p>

                <input type="text" id="nomeUsuario" placeholder="Digite seu nome..."
                    onkeypress="if(event.key === 'Enter') realizarLogin()"
                    style="width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #ccc;">

                <button id="btnIniciarPartida" class="btn-primary">
                    ENTRAR NA PARTIDA
                </button>
            </div>
        </div>

        <!-- GALERIA (ID CORRETO) -->
        <div id="galeriaDesenhos" class="overlay" style="display: none;">
            <div class="modal modal-grande">
                <h2>Escolha o desenho</h2>

                <div id="listaDesenhos" class="grid-drawings"></div>

                <button onclick="fecharGaleria()" class="btn-cancelar">
                    CANCELAR
                </button>
            </div>
        </div>

        <!-- ÁREA DO JOGO -->
        <main class="game-area">

            <!-- CANVAS -->
            <section class="canvas-section">

                <div class="controles-modo"
                    style="position: absolute; top: 80px; z-index: 100; display: flex; gap: 10px; width: 100%; justify-content: center;">

                    <button onclick="modoManual()" class="btn-primary">
                        DESENHO MANUAL
                    </button>

                    <button onclick="alternarModoAutomatico()" class="btn-primary">
                        DESENHO AUTOMÁTICO
                    </button>

                    <!-- BOTÃO CONTROLADO PELO JS -->
                    <button id="btnConfirmarInicio"
                        onclick="confirmarInicioJogo()"
                        class="btn-primary hidden">
                        OK - INICIAR RODADA
                    </button>

                </div>

                <canvas id="quadro" width="800" height="500"></canvas>
            </section>

            <!-- CHAT -->
            <section class="chat-section">
                <div class="chat-window" id="janelaChat" role="log">
                    <p><strong>Sistema:</strong> Bem-vindo! Aguarde o início.</p>
                </div>

                <div class="chat-controls">
                    <input type="text" id="chutePalavra"
                        placeholder="Qual é o desenho?"
                        onkeypress="if(event.key === 'Enter') enviarChute()">

                    <button onclick="enviarChute()" class="btn-primary">
                        CHUTAR
                    </button>
                </div>
            </section>

        </main>
    </div>

    <!-- 🔥 FIREBASE (OBRIGATÓRIO) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- SEUS SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/desenho.js"></script>
    <script src="js/jogo.js"></script>

</body>
</html>
