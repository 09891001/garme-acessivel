<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garme - Jogo Acessível de Desenho</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

header{
background:#0057b8;
color:white;
padding:10px;
}

h1{
margin:0;
font-size:22px;
}

#painel{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

#area-jogo{
flex:2;
}

#area-chat{
flex:1;
}

#quadro{
border:2px solid #333;
background:white;
touch-action:none;
}

#janela-chat{
height:300px;
overflow:auto;
border:1px solid #ccc;
background:white;
padding:10px;
}

.log-entry{
padding:5px;
border-left:4px solid #ccc;
margin-bottom:5px;
}

button{
margin:5px;
padding:8px 12px;
cursor:pointer;
}

.hidden{
display:none;
}

#menu-desenhista{
border:1px solid #ccc;
padding:10px;
margin-top:10px;
background:white;
}

#cronometro{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

#status-turno{
margin-top:10px;
padding:5px;
background:#666;
color:white;
}

</style>

</head>

<body>

<header>

<h1>Garme - Jogo de Desenho Acessível</h1>

<div>
Jogador: <span id="nome-jogador"></span>
</div>

<div>
Pontos: <span id="pontos">0</span>
</div>

<div id="cronometro">
00:00
</div>

<div id="status-turno">
Aguardando turno
</div>

</header>

<section id="painel">

<!-- AREA DO DESENHO -->

<div id="area-jogo">

<canvas
id="quadro"
width="800"
height="400"
aria-label="Quadro de desenho"
></canvas>

<div>

<button onclick="limparQuadro()">
Limpar quadro
</button>

<button onclick="ativarCaneta()">
Modo desenhar
</button>

<button onclick="ativarBorracha()">
Borracha
</button>

</div>

<!-- MENU DESENHISTA -->

<div id="menu-desenhista" class="hidden">

<h2>Escolha a palavra</h2>

<button onclick="engineIniciarRodada('casa')">
Iniciar rodada palavra CASA
</button>

<button onclick="engineIniciarRodada('gato')">
Iniciar rodada palavra GATO
</button>

<button onclick="engineIniciarRodada('carro')">
Iniciar rodada palavra CARRO
</button>

<h3>Desenhos prontos</h3>

<button onclick="desenhoPronto('casa')">
Desenho CASA
</button>

<button onclick="desenhoPronto('gato')">
Desenho GATO
</button>

<button onclick="desenhoPronto('carro')">
Desenho CARRO
</button>

</div>

</div>

<!-- CHAT -->

<div id="area-chat">

<h2>Chat do jogo</h2>

<div
id="janela-chat"
aria-live="polite"
></div>

<input
id="input-palpite"
type="text"
placeholder="Digite seu palpite"
aria-label="Digite seu palpite"
>

<button onclick="enviarPalpite()">
Enviar
</button>

</div>

</section>

<script>

// ============================
// IDENTIDADE DO JOGADOR
// ============================

let nomeUsuario = localStorage.getItem("usuario_game");

if(!nomeUsuario){

nomeUsuario = prompt("Digite seu nome");

localStorage.setItem("usuario_game",nomeUsuario);

}

document.getElementById("nome-jogador").innerText = nomeUsuario;


// ============================
// QUADRO DE DESENHO
// ============================

const canvas = document.getElementById("quadro");

const ctx = canvas.getContext("2d");

let desenhando = false;

let modoBorracha = false;

function posicao(event){

const rect = canvas.getBoundingClientRect();

if(event.touches){

return{

x:event.touches[0].clientX - rect.left,
y:event.touches[0].clientY - rect.top

}

}

return{

x:event.clientX - rect.left,
y:event.clientY - rect.top

}

}

function iniciar(event){

desenhando = true;

const p = posicao(event);

ctx.beginPath();

ctx.moveTo(p.x,p.y);

}

function desenhar(event){

if(!desenhando) return;

event.preventDefault();

const p = posicao(event);

ctx.lineWidth = 3;

ctx.lineCap = "round";

ctx.strokeStyle = modoBorracha ? "white" : "black";

ctx.lineTo(p.x,p.y);

ctx.stroke();

}

function parar(){

desenhando = false;

}

canvas.addEventListener("mousedown",iniciar);
canvas.addEventListener("mousemove",desenhar);
canvas.addEventListener("mouseup",parar);

canvas.addEventListener("touchstart",iniciar);
canvas.addEventListener("touchmove",desenhar);
canvas.addEventListener("touchend",parar);

function limparQuadro(){

ctx.clearRect(0,0,canvas.width,canvas.height);

}

function ativarCaneta(){

modoBorracha = false;

}

function ativarBorracha(){

modoBorracha = true;

}


// ============================
// DESENHOS PRONTOS
// ============================

function desenhoPronto(tipo){

limparQuadro();

ctx.lineWidth = 4;

if(tipo === "casa"){

ctx.strokeRect(300,200,200,150);

ctx.beginPath();
ctx.moveTo(300,200);
ctx.lineTo(400,120);
ctx.lineTo(500,200);
ctx.stroke();

}

if(tipo === "gato"){

ctx.beginPath();
ctx.arc(400,200,80,0,Math.PI*2);
ctx.stroke();

}

if(tipo === "carro"){

ctx.strokeRect(300,200,250,80);

ctx.beginPath();
ctx.arc(330,280,30,0,Math.PI*2);
ctx.arc(500,280,30,0,Math.PI*2);
ctx.stroke();

}

}

</script>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="firebase-config.js"></script>

<script src="jogo.js"></script>

</body>

</html>
