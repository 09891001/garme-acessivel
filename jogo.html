<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Garme Acessível - Sala de Jogo</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<link rel="stylesheet" href="css/totvs.css">

<style>

body, html{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#f4f7f9;
font-family:Arial, Helvetica, sans-serif;
}

/* Estrutura geral */

.game-wrapper{
display:flex;
flex-direction:column;
height:100vh;
}

/* topo */

.header-game{
background:#004b81;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
}

/* área do quadro */

.area-quadro{
flex:1;
position:relative;
background:#ccd5de;
display:flex;
justify-content:center;
align-items:center;
}

/* canvas */

canvas{
background:white;
border:3px solid #004b81;
max-width:95%;
max-height:95%;
touch-action:none;
}

/* cronometro */

.badge-tempo{
position:absolute;
top:10px;
left:10px;
background:#ff4b4b;
color:white;
padding:6px 14px;
border-radius:20px;
font-weight:bold;
font-size:18px;
}

/* botão limpar */

#painel-desenhista{
position:absolute;
bottom:10px;
right:10px;
}

/* área de chat */

.area-chat{
height:35%;
background:white;
border-top:4px solid #004b81;
display:flex;
flex-direction:column;
}

/* mensagens */

#box-mensagens{
flex:1;
overflow-y:auto;
padding:10px;
font-size:14px;
}

/* painel de envio */

.painel-envio{
display:flex;
gap:8px;
padding:10px;
background:#eef2f7;
}

.painel-envio input{
flex:1;
padding:12px;
border-radius:8px;
border:2px solid #ccc;
font-size:16px;
}

.painel-envio button{
padding:12px 20px;
background:#004b81;
color:white;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="game-wrapper">

<!-- topo -->

<div class="header-game">

<div id="perfil-usuario">Jogador</div>

<div>
Pontos:
<span id="pontos">0</span>
</div>

</div>

<!-- área do quadro -->

<div class="area-quadro">

<div class="badge-tempo" id="cronometro-tag">01:00</div>

<canvas id="quadro" width="800" height="500"></canvas>

<div id="painel-desenhista" style="display:none">

<button onclick="limparQuadro()" style="background:#ff4b4b;color:white;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;">
LIMPAR
</button>

</div>

</div>

<!-- chat -->

<div class="area-chat">

<div id="box-mensagens" aria-live="polite"></div>

<div class="painel-envio">

<label for="campo-palpite" style="position:absolute;left:-9999px;">Digite seu palpite</label>

<input
type="text"
id="campo-palpite"
placeholder="Qual é o desenho?"
autocomplete="off"
/>

<button onclick="enviarPalpite()">Enviar</button>

</div>

</div>

</div>

<!-- scripts do projeto -->

<script src="js/config.js"></script>
<script src="js/desenho.js"></script>
<script src="js/jogo.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function(){

const nome = localStorage.getItem("usuario_garme");

if(!nome){

alert("Você precisa entrar pelo index.");

window.location.href = "index.html";

return;

}

const perfil = document.getElementById("perfil-usuario");

if(perfil){
perfil.innerText = "👤 " + nome;
}

/* inicia o motor do jogo */

if(window.inicializarPartida){
inicializarPartida();
}

/* tecla enter para enviar palpite */

const campo = document.getElementById("campo-palpite");

if(campo){

campo.addEventListener("keypress", function(e){

if(e.key === "Enter"){
enviarPalpite();
}

});

}

});

</script>

</body>
</html>
